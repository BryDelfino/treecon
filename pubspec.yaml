name: treecon
environment:
  sdk: ^3.6.0

workspace:
  - apps/scout_mobile
  - apps/commander_web
  - packages/core
  - packages/shared_models
  - packages/shared_services
  - packages/shared_ui

dev_dependencies:
  melos: ^7.8.1

melos:
  scripts:
    analyze:
      run: melos exec -- flutter analyze
      description: Run analysis in all packages.

    test: 
      run: melos exec --dir-exists="test" -- flutter test
      description: Run tests in packages that have tests.

    build:android:
      run: |
        cd apps/scout_mobile
        flutter build appbundle --release
      description: Build Android App Bundle (Scout Mobile).

    build:ios:
      run: |
        cd apps/scout_mobile
        flutter build ios --release --no-codesign
        description: Build iOS (Scout Mobile) without code signing.

    build:web:
      run: |
        cd apps/commander_web
        flutter build web --release
      description: Build Web (Commander Web).


    build:all:
      run: |
        melos run build:android
        melos run build:web
      description: Build all non-macOS targets.

